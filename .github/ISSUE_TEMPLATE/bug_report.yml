name: Bug report
description: Something in the skill or a script is wrong or broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened?, description: What did you expect vs. get?}
    validations: {required: true}
  - type: input
    id: where
    attributes: {label: Which file/script?, placeholder: e.g. scripts/site_check.py}
  - type: textarea
    id: repro
    attributes: {label: Steps to reproduce}
  - type: checkboxes
    id: scope
    attributes:
      label: Confirmation
      options:
        - {label: "This report does not request or describe unauthorized attacks on third-party systems.", required: true}
