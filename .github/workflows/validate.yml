name: Validate skill

on:
  push:
    paths: ['plugins/**', 'tools/**', '.github/workflows/validate.yml']
  pull_request:
    paths: ['plugins/**', 'tools/**', '.github/workflows/validate.yml']
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate SKILL.md frontmatter, mappings, scripts & index
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Guard against regex frontmatter parsing
        run: |
          if grep -rnE 're\.(search|match|compile)\([^)]*description' tools/ --include='*.py'; then
            echo "::error::Use PyYAML to parse frontmatter, not regex."; exit 1
          fi
          echo "OK: no regex frontmatter parsers"
      - name: Validate skill
        run: python tools/validate_skill.py
      - name: Smoke-test scripts (no network)
        run: |
          cd plugins/website-security-shield/skills/website-security-shield
          python scripts/code_scan.py . --json > /dev/null
          python scripts/pentest_checklist.py --json > /dev/null
          python scripts/build_index.py
          git diff --exit-code index.json || (echo "::error::index.json out of date; commit the regenerated file"; exit 1)
